<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <!-- SEO Meta Tags -->
  <title>الدردشة — وَصْل</title>
  <meta name="description" content="غرف الدردشة الفورية في وَصْل — تحدث مع أصدقائك في الوقت الحقيقي" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="وَصْل" />

  <link rel="manifest" href="/manifest.json" />

  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Prevent Flash of Wrong Theme -->
  <script>
    (function(){
      var t = localStorage.getItem('wasl_theme') || 'dark';
      document.documentElement.style.colorScheme = t;
      if (t === 'light') document.documentElement.classList.add('light-pre');
    })();
  </script>
  <style>
    html:not(.light-pre) body { background: #0d0f14; }
    html.light-pre      body { background: #f8fafc; }
    /* Chat page takes full viewport */

</head>
<body class="dark-mode">

<!-- ══════════════════════════════════════ -->
<!-- CHAT SCREEN -->
<!-- ══════════════════════════════════════ -->
<div id="chat-screen" class="chat-screen" style="display:flex">

  <!-- Sidebar -->

    <div class="sidebar-header">
      <div class="app-brand">
        <img src="/logo.png" alt="وَصْل" class="nav-logo-img" style="width:28px;height:28px" />
        <span class="brand-name">وَصْل</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <!-- Notification Bell -->
        <button id="notif-bell" class="notif-bell-btn" onclick="toggleNotifPanel()" title="الإشعارات">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notif-count" class="notif-count hidden">0</span>
        </button>
        <button id="theme-toggle" class="theme-toggle" title="تبديل الوضع"><span id="theme-icon">☀️</span></button>
        <button class="theme-toggle" onclick="backToLobby()" title="العودة للغرف">🏠</button>
      </div>
    </div>

    <!-- Notification Panel -->
    <div id="notif-panel" class="notif-panel hidden">
      <div class="notif-panel-header">
        <span class="notif-panel-title">🔔 الإشعارات</span>
        <div style="display:flex;gap:6px">
          <button class="notif-action-btn" onclick="markAllRead()" title="تحديد الكل كمقروء">✓ الكل</button>
          <button class="notif-action-btn" onclick="clearAllNotifs()" title="مسح الكل">🗑️</button>
        </div>
      </div>
      <div id="notif-list" class="notif-list">
        <div class="notif-empty">لا توجد إشعارات بعد</div>
      </div>
    </div>

    <!-- Current Room -->
    <div class="sidebar-room" id="sidebar-room-card">
      <div class="sidebar-room-avatar" id="sidebar-room-avatar-wrap">
        <div class="room-icon" id="sidebar-room-icon">💬</div>
      </div>
      <div class="room-info" style="flex:1;min-width:0">
        <div class="room-name" id="sidebar-room-name">—</div>
        <div class="room-status" id="room-status">جاري الاتصال...</div>
        <div id="room-meta-tags" style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap"></div>
      </div>
      <button id="room-settings-btn" class="room-settings-btn hidden" onclick="openRoomSettings()" title="إعدادات الغرفة">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Room ID copy -->
    <div class="room-id-box">
      <span class="room-id-label">رمز الغرفة:</span>
      <span class="room-id-val" id="room-id-display">—</span>

    </div>

    <!-- Users in room -->
    <div class="sidebar-users">
      <div class="users-label">في الغرفة</div>
      <div id="users-list" class="users-list"></div>
    </div>

    <div class="sidebar-footer">
      <div class="my-profile">
        <div class="my-avatar" id="my-avatar">?</div>
        <div class="my-name" id="my-name-display">أنت</div>
        <div class="online-dot"></div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->

        <button class="mobile-sidebar-btn" id="mobile-sidebar-btn" onclick="toggleMobileSidebar()" title="القائمة">

        </button>
        <div class="header-icon">💬</div>
        <div>
          <div class="header-title" id="header-room-name">الغرفة</div>

      </div>
      <div class="header-actions">
        <!-- DND -->
        <button id="dnd-btn" class="header-icon-btn" onclick="toggleDND()" title="وضع عدم الإزعاج">🔔</button>
        <!-- Search -->

        </button>
        <!-- Pinned -->
        <button class="header-icon-btn" onclick="togglePinned()" title="الرسائل المثبتة (Ctrl+P)">📌</button>
        <!-- Share -->

        <!-- Export -->

        <div id="connection-badge" class="connection-badge offline">
          <span class="badge-dot"></span>
          <span class="badge-text">غير متصل</span>
        </div>
      </div>
    </header>

    <!-- Search Bar -->
    <div id="search-bar" class="search-bar hidden">
      <div class="search-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;color:var(--text-muted)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" class="search-input-field" placeholder="ابحث في الرسائل..." />
        <button class="search-close-btn" onclick="toggleSearch()">✕</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- Pinned Messages Panel -->
    <div id="pinned-panel" class="pinned-panel hidden">
      <div class="pinned-panel-header">
        <span>📌 الرسائل المثبتة</span>
        <button class="search-close-btn" onclick="togglePinned()">✕</button>
      </div>
      <div id="pinned-list" class="pinned-list"></div>
    </div>

    <div id="messages" class="messages-area">
      <div class="welcome-msg">
        <div class="welcome-icon" style="font-size:36px">⏳</div>
        <p>جاري تحميل الغرفة...</p>
      </div>
    </div>

    <div id="typing-indicator" class="typing-indicator hidden">
      <div class="typing-bubble">
        <span class="typing-name" id="typing-name"></span>
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>
    </div>

    <div id="reply-preview" class="reply-preview hidden">
      <div class="reply-content">
        <span class="reply-label">↩ رد على:</span>
        <span class="reply-text" id="reply-text-preview"></span>
      </div>
      <button id="cancel-reply" class="cancel-reply">✕</button>
    </div>

    <footer class="input-area">
      <button id="emoji-btn" class="action-btn emoji-trigger" title="إيموجي">😊</button>
      <label class="action-btn" for="file-upload" title="إرسال ملف أو صورة">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <input type="file" id="file-upload" accept="image/*,.pdf,.doc,.docx" class="hidden-input" />
      </label>
      <div id="attachment-preview" class="attachment-preview hidden">
        <img id="preview-img" src="" alt="preview" class="hidden" />
        <div id="file-preview-info" class="file-preview-info hidden">
          <span class="file-icon">📄</span>
          <span id="file-preview-name" class="file-preview-name"></span>
        </div>
        <button id="remove-attachment" class="remove-img">✕</button>
      </div>
      <div class="text-input-wrapper">
        <textarea id="message-input" class="message-input" placeholder="اكتب رسالتك..." rows="1" maxlength="1000"></textarea>
      </div>
      <button id="send-btn" class="send-btn" title="إرسال">

    <div id="emoji-picker" class="emoji-picker hidden">

        <input type="text" id="emoji-search" class="emoji-search" placeholder="ابحث عن إيموجي..." />
      </div>
      <div class="emoji-categories">
        <button class="emoji-cat active" data-cat="smileys">😊</button>
        <button class="emoji-cat" data-cat="gestures">👋</button>
        <button class="emoji-cat" data-cat="hearts">❤️</button>
        <button class="emoji-cat" data-cat="objects">🎉</button>
        <button class="emoji-cat" data-cat="nature">🌿</button>

<!-- Room Settings Modal -->

    </div>
    <div class="room-modal-section">
      <label class="room-modal-label">وصف الغرفة</label>
      <textarea id="edit-room-desc" class="login-input" maxlength="200" rows="2" style="resize:none;font-family:inherit;line-height:1.5"></textarea>

    <div class="room-modal-section">

        <option value="10">10 مستخدمين</option><option value="25">25 مستخدم</option>
        <option value="50">50 مستخدم</option><option value="100">100 مستخدم</option>
      </select>
    </div>
    <div class="room-modal-section">
      <label class="checkbox-label">
        <input type="checkbox" id="edit-room-persistent" />
        <span class="checkbox-custom"></span>
        📌 حفظ الغرفة بعد خروج الجميع
      </label>
    </div>
    <div id="edit-room-error" class="form-error hidden"></div>
    <div class="room-modal-footer">
      <button class="join-btn" onclick="saveRoomSettings()">💾 حفظ الإعدادات</button>
      <button class="join-btn secondary-btn" onclick="closeRoomSettings()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="app-footer" id="app-footer" style="display:block">
  <span>by omar benbouzid dev</span>
</footer>

<!-- PWA Install Bar -->
<div id="pwa-install-bar" class="pwa-install-bar hidden">
  <div class="pwa-install-content">
    <img src="/logo.png" alt="وَصْل" class="pwa-install-icon" />
    <div class="pwa-install-text">
      <strong>ثبّت وَصْل</strong>
      <span>تجربة أسرع كتطبيق على جهازك</span>
    </div>
  </div>
  <div class="pwa-install-actions">
    <button id="pwa-install-btn" class="pwa-btn-accept" onclick="installPWA()">تثبيت</button>
    <button class="pwa-btn-dismiss" onclick="dismissPWA()">لاحقاً</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>

<!-- PWA -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if (!localStorage.getItem('wasl_pwa_dismissed')) setTimeout(() => {
    const bar = document.getElementById('pwa-install-bar');
    if(bar) { bar.classList.remove('hidden'); bar.classList.add('pwa-slide-up'); }
  }, 3000);
});
window.installPWA = async function() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('pwa-install-bar')?.classList.add('hidden');
};
window.dismissPWA = function() {
  localStorage.setItem('wasl_pwa_dismissed','1');
  document.getElementById('pwa-install-bar')?.classList.add('hidden');
};
window.addEventListener('offline', () => { if(window.addSystemMessage) addSystemMessage('📡 انقطع الاتصال بالإنترنت'); });
window.addEventListener('online',  () => { if(window.addSystemMessage) addSystemMessage('✅ عاد الاتصال بالإنترنت'); });
</script>
