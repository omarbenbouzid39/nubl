<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightChat — دردشة خاصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark-mode">

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">💬</div>
        <h1 class="logo-title">NightChat</h1>
        <p class="logo-sub">دردشة خاصة • آمنة • فورية</p>
      </div>
      <div class="login-form">
        <input type="text" id="username-input" class="login-input" placeholder="اكتب اسمك هنا..." maxlength="20" autocomplete="off" />
        <button id="join-btn" class="join-btn">
          <span>ادخل الشات</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="chat-screen hidden">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="app-brand">
          <span class="brand-icon">💬</span>
          <span class="brand-name">NightChat</span>
        </div>
        <button id="theme-toggle" class="theme-toggle" title="تبديل الوضع">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
      <div class="sidebar-room">
        <div class="room-icon">🔒</div>
        <div class="room-info">
          <div class="room-name">الغرفة الخاصة</div>
          <div class="room-status" id="room-status">جاري الاتصال...</div>
        </div>
      </div>
      <div class="sidebar-users">
        <div class="users-label">المتصلون الآن</div>
        <div id="users-list" class="users-list"></div>
      </div>
      <div class="sidebar-footer">
        <div class="my-profile">
          <div class="my-avatar" id="my-avatar">?</div>
          <div class="my-name" id="my-name-display">أنت</div>
          <div class="online-dot"></div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">

      <!-- Chat Header -->
      <header class="chat-header">
        <div class="header-info">
          <div class="header-icon">💬</div>
          <div>
            <div class="header-title">الغرفة الخاصة</div>
            <div class="header-subtitle" id="online-count">0 متصل</div>
          </div>
        </div>
        <div class="header-actions">
          <div id="connection-badge" class="connection-badge offline">
            <span class="badge-dot"></span>
            <span class="badge-text">غير متصل</span>
          </div>
        </div>
      </header>

      <!-- Messages Area -->
      <div id="messages" class="messages-area">
        <div class="welcome-msg">
          <div class="welcome-icon">🌙</div>
          <p>مرحباً بك في NightChat</p>
          <small>ابدأ الدردشة مع صديقك الآن</small>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <div class="typing-bubble">
          <span class="typing-name" id="typing-name"></span>
          <span class="typing-dots"><span></span><span></span><span></span></span>
        </div>
      </div>

      <!-- Reply Preview Bar -->
      <div id="reply-preview" class="reply-preview hidden">
        <div class="reply-content">
          <span class="reply-label">↩ رد على:</span>
          <span class="reply-text" id="reply-text-preview"></span>
        </div>
        <button id="cancel-reply" class="cancel-reply">✕</button>
      </div>

      <!-- Input Area -->
      <footer class="input-area">
        <button id="emoji-btn" class="action-btn emoji-trigger" title="إيموجي">😊</button>

        <label class="action-btn" for="file-upload" title="إرسال ملف أو صورة">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <input type="file" id="file-upload" accept="image/*,.pdf,.doc,.docx" class="hidden-input" />
        </label>

        <!-- File/Image preview -->
        <div id="attachment-preview" class="attachment-preview hidden">
          <img id="preview-img" src="" alt="preview" class="hidden" />
          <div id="file-preview-info" class="file-preview-info hidden">
            <span class="file-icon">📄</span>
            <span id="file-preview-name" class="file-preview-name"></span>
          </div>
          <button id="remove-attachment" class="remove-img">✕</button>
        </div>

        <div class="text-input-wrapper">
          <textarea id="message-input" class="message-input" placeholder="اكتب رسالتك..." rows="1" maxlength="2000"></textarea>
        </div>

        <button id="send-btn" class="send-btn" title="إرسال">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </footer>

      <!-- Emoji Picker -->
      <div id="emoji-picker" class="emoji-picker hidden">
        <div class="emoji-search-wrap">
          <input type="text" id="emoji-search" class="emoji-search" placeholder="ابحث عن إيموجي..." />
        </div>
        <div class="emoji-categories">
          <button class="emoji-cat active" data-cat="smileys">😊</button>
          <button class="emoji-cat" data-cat="gestures">👋</button>
          <button class="emoji-cat" data-cat="hearts">❤️</button>
          <button class="emoji-cat" data-cat="objects">🎉</button>
          <button class="emoji-cat" data-cat="nature">🌿</button>
          <button class="emoji-cat" data-cat="food">🍕</button>
        </div>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
    </main>
  </div>

  <!-- Image Modal -->
  <div id="img-modal" class="img-modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <img id="modal-img" src="" alt="full image" />
    </div>
  </div>

  <!-- Context Menu (right-click on message) -->
  <div id="context-menu" class="context-menu hidden">
    <button class="ctx-item" id="ctx-reply">↩ رد</button>
    <button class="ctx-item" id="ctx-react">❤️ تفاعل</button>
    <button class="ctx-item ctx-danger" id="ctx-delete">🗑️ حذف</button>
  </div>

  <!-- Reaction Picker (inline) -->
  <div id="reaction-picker" class="reaction-picker hidden">
    <span class="react-emoji" data-emoji="❤️">❤️</span>
    <span class="react-emoji" data-emoji="😂">😂</span>
    <span class="react-emoji" data-emoji="😮">😮</span>
    <span class="react-emoji" data-emoji="😢">😢</span>
    <span class="react-emoji" data-emoji="👍">👍</span>
    <span class="react-emoji" data-emoji="🔥">🔥</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
