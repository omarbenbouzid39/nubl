<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ملفي الشخصي | وَصْل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared-pages.css" />
  <style>
    .profile-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* ── Hero card ── */
    .profile-card {
      background: var(--card-bg, #111318);
      border: 1px solid var(--border, #1e2535);
      border-radius: 20px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .profile-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 80px;
      background: linear-gradient(135deg, #3b82f620 0%, #8b5cf620 100%);
    }

    .profile-avatar-wrap { position: relative; z-index: 1; }
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      background: #1e2130;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #f1f5f9;
      object-fit: cover;
      overflow: hidden;
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text, #f1f5f9);
    }

    /* Verified badge */
    .verified-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #3b82f6;
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 10px #3b82f660;
    }
    .verified-label {
      font-size: 12px;
      color: #3b82f6;
      font-weight: 600;
      background: #3b82f615;
      border: 1px solid #3b82f630;
      border-radius: 999px;
      padding: 3px 10px;
    }
    .unverified-label {
      font-size: 12px;
      color: #8892a4;
      background: #1e213020;
      border: 1px solid #1e253520;
      border-radius: 999px;
      padding: 3px 10px;
    }

    .profile-bio {
      font-size: 14px;
      color: #8892a4;
      text-align: center;
      max-width: 400px;
      line-height: 1.7;
    }

    /* ── Edit form ── */
    .edit-card {
      background: var(--card-bg, #111318);
      border: 1px solid var(--border, #1e2535);
      border-radius: 16px;
      padding: 28px 28px;
      margin-top: 24px;
    }
    .edit-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text, #f1f5f9);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-field { margin-bottom: 16px; }
    .edit-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8892a4;
      margin-bottom: 6px;
      letter-spacing: .5px;
    }
    .edit-input {
      width: 100%;
      background: #0d0f14;
      border: 1px solid #1e2535;
      border-radius: 10px;
      color: #f1f5f9;
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s;
    }
    .edit-input:focus { border-color: #3b82f6; }
    textarea.edit-input { resize: vertical; min-height: 80px; }

    .avatar-preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .avatar-preview-mini {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #1e2535;
      background: #1e2130;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #f1f5f9;
      overflow: hidden;
    }
    .avatar-preview-mini img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      margin-top: 8px;
      transition: opacity .2s;
    }
    .save-btn:hover { opacity: .9; }
    .save-btn:disabled { opacity: .5; cursor: not-allowed; }

    .save-msg {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
      color: #22c55e;
    }
    .save-msg.err { color: #ef4444; }

    /* back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8892a4;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 24px;
      transition: color .2s;
    }
    .back-link:hover { color: #3b82f6; }

    @media (max-width: 600px) {
      .profile-card { padding: 28px 16px; }
      .edit-card { padding: 20px 16px; }
    }
  </style>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2326556370802000" crossorigin="anonymous"></script>
</head>
<body class="dark-mode">
<script src="shared.js"></script>

<div class="page-wrap">
  <div class="profile-wrap">

    <a href="/index.html" class="back-link">← العودة للدردشة</a>

    <!-- Profile Display Card -->
    <div class="profile-card" id="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="display-avatar">؟</div>
      </div>
      <div class="profile-name-row">
        <span id="display-username">—</span>
        <span class="verified-badge" id="display-verified-badge" style="display:none" title="موثق">✔</span>
      </div>
      <span id="display-verified-label" class="unverified-label" style="display:none">غير موثق</span>
      <p class="profile-bio" id="display-bio">لا توجد نبذة بعد</p>
    </div>

    <!-- Edit Card -->
    <div class="edit-card" id="edit-card">
      <h3>✏️ تعديل الملف الشخصي</h3>

      <div class="edit-field">
        <label class="edit-label" for="avatar-url">رابط الصورة الشخصية (URL)</label>
        <input type="url" id="avatar-url" class="edit-input" placeholder="https://example.com/photo.jpg" />
        <div class="avatar-preview-row">
          <div class="avatar-preview-mini" id="avatar-mini">؟</div>
          <span style="font-size:12px;color:#8892a4">معاينة الصورة</span>
        </div>
      </div>

      <div class="edit-field">
        <label class="edit-label" for="bio-input">النبذة الشخصية</label>
        <textarea id="bio-input" class="edit-input" placeholder="اكتب نبذة عن نفسك..." maxlength="200"></textarea>
        <div style="font-size:11px;color:#4b5563;margin-top:4px;text-align:left"><span id="bio-count">0</span> / 200</div>
      </div>

      <button class="save-btn" id="save-btn" onclick="saveProfile()">💾 حفظ التغييرات</button>
      <div class="save-msg" id="save-msg"></div>
    </div>

    <div style="text-align:center;margin-top:28px;font-size:12px;color:#4b5563">by omar benbouzid dev</div>
  </div>
</div>

<script>
  // ── Load user from localStorage ──
  const saved = localStorage.getItem('wasl_user');
  let currentUser = null;

  if (!saved) {
    window.location.href = '/index.html';
  } else {
    try { currentUser = JSON.parse(saved); } catch(_) { window.location.href = '/index.html'; }
  }

  async function loadProfile() {
    if (!currentUser) return;
    // Fetch fresh from server
    try {
      const res  = await fetch(`/api/profile/${encodeURIComponent(currentUser.username)}`);
      const data = await res.json();
      if (res.ok) {
        currentUser.verified = data.verified;
        currentUser.avatar   = data.avatar;
        currentUser.bio      = data.bio;
        localStorage.setItem('wasl_user', JSON.stringify(currentUser));
      }
    } catch(_) {}

    renderProfile();
  }

  function renderProfile() {
    const u = currentUser;
    document.getElementById('display-username').textContent = u.username || '—';

    // Avatar
    const dispAvatar = document.getElementById('display-avatar');
    if (u.avatar) {
      dispAvatar.innerHTML = `<img src="${escHtml(u.avatar)}" onerror="this.parentElement.textContent='${u.username.charAt(0).toUpperCase()}'" />`;
    } else {
      dispAvatar.textContent = u.username.charAt(0).toUpperCase();
    }

    // Verified
    const badge = document.getElementById('display-verified-badge');
    const lbl   = document.getElementById('display-verified-label');
    if (u.verified) {
      badge.style.display = 'inline-flex';
      lbl.textContent = '✔ موثق';
      lbl.className = 'verified-label';
      lbl.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
      lbl.textContent = 'غير موثق';
      lbl.className = 'unverified-label';
      lbl.style.display = 'inline-flex';
    }

    // Bio
    const bioEl = document.getElementById('display-bio');
    bioEl.textContent = u.bio || 'لا توجد نبذة بعد';

    // Fill form
    document.getElementById('avatar-url').value = u.avatar || '';
    document.getElementById('bio-input').value  = u.bio    || '';
    document.getElementById('bio-count').textContent = (u.bio || '').length;
    updateAvatarMini(u.avatar, u.username);
  }

  function updateAvatarMini(url, username) {
    const mini = document.getElementById('avatar-mini');
    if (url) {
      mini.innerHTML = `<img src="${escHtml(url)}" onerror="this.parentElement.textContent='${(username||'?').charAt(0).toUpperCase()}'" />`;
    } else {
      mini.textContent = (username || '?').charAt(0).toUpperCase();
    }
  }

  document.getElementById('avatar-url').addEventListener('input', e => {
    updateAvatarMini(e.target.value.trim(), currentUser?.username);
  });

  document.getElementById('bio-input').addEventListener('input', e => {
    document.getElementById('bio-count').textContent = e.target.value.length;
  });

  async function saveProfile() {
    const btn     = document.getElementById('save-btn');
    const msgEl   = document.getElementById('save-msg');
    const avatar  = document.getElementById('avatar-url').value.trim();
    const bio     = document.getElementById('bio-input').value.trim();

    btn.disabled  = true;
    msgEl.textContent = '';
    msgEl.className   = 'save-msg';

    try {
      const res  = await fetch('/api/profile/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, avatar, bio })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'فشل الحفظ');
      currentUser.avatar = avatar;
      currentUser.bio    = bio;
      localStorage.setItem('wasl_user', JSON.stringify(currentUser));
      renderProfile();
      msgEl.textContent = '✅ تم حفظ التغييرات بنجاح';
    } catch(e) {
      msgEl.textContent = '❌ ' + (e.message || 'خطأ في الحفظ');
      msgEl.className   = 'save-msg err';
    } finally {
      btn.disabled = false;
    }
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Load on start
  loadProfile();
</script>
</body>
</html>
