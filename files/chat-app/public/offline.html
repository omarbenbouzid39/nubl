<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>غير متصل — وَصْل</title>
  <link rel="icon" href="/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14; --card: #161923; --border: #1e2535;
      --accent: #3b82f6; --text: #f1f5f9; --muted: #8892a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px #00000060;
      animation: up 0.5s ease;
    }
    @keyframes up { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .icon {
      font-size: 72px;
      margin-bottom: 20px;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p  { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
    .btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 32px;
      transition: all .2s;
      width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px #3b82f640; }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .logo-wrap { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px; }
    .logo-wrap img { width:36px; height:36px; border-radius:50%; object-fit:cover; }
    .logo-name { font-size:18px; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo.png" alt="وَصْل" onerror="this.style.display='none'" />
      <span class="logo-name">وَصْل</span>
    </div>
    <span class="icon">📡</span>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن الاتصال بالإنترنت منقطع. تحقق من شبكتك وحاول مرة أخرى.</p>
    <button class="btn" onclick="retry()">🔄 إعادة المحاولة</button>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">غير متصل</span>
    </div>
  </div>
  <script>
    function retry() {
      window.location.reload();
    }
    // Auto-retry when connection returns
    window.addEventListener('online', () => {
      document.getElementById('dot').style.background = '#22c55e';
      document.getElementById('status-text').textContent = 'تم الاتصال! جاري التحويل...';
      setTimeout(() => window.location.href = '/', 800);
    });
    window.addEventListener('offline', () => {
      document.getElementById('dot').style.background = '#ef4444';
      document.getElementById('status-text').textContent = 'غير متصل';
    });
  </script>
</body>
</html>
