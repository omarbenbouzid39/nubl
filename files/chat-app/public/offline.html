<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وَصْل — غير متصل بالإنترنت</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14;
      --card: #161923;
      --accent: #3b82f6;
      --text: #f1f5f9;
      --muted: #8892a4;
      --border: #1e2535;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 32px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .pages {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .page-link {
      color: var(--accent);
      font-size: 14px;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      background: #3b82f615;
      transition: background 0.2s;
    }
    .page-link:hover { background: #3b82f625; }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">📡</span>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصالك بالإنترنت انقطع. تحقق من الاتصال وأعد المحاولة، أو تصفح الصفحات المحفوظة مسبقاً.</p>
    <button class="btn" onclick="window.location.reload()">🔄 إعادة المحاولة</button>
    <div class="pages">
      <p style="font-size:13px;color:var(--muted);margin-bottom:4px">الصفحات المتاحة بدون إنترنت:</p>
      <a href="/index.html" class="page-link">💬 الدردشة</a>
      <a href="/blog.html" class="page-link">📝 المدونة</a>
      <a href="/about.html" class="page-link">ℹ️ من نحن</a>
    </div>
  </div>
</body>
</html>
