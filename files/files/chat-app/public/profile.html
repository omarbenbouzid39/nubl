<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ملف المستخدم — وَصْل" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <title>ملف المستخدم — وَصْل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared-pages.css" />
  <style>
    .profile-wrap {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }
    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-bottom: 24px;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 8px 30px #3b82f640;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .profile-username {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .profile-verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #3b82f6;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .profile-verified-badge::before { content: "✔"; }
    .profile-online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .profile-offline-dot { width: 10px; height: 10px; border-radius: 50%; background: #4b5563; }
    .profile-status { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .profile-join-date { font-size: 12px; color: var(--text-muted); }
    .profile-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 28px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .profile-room-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
    }
    .profile-room-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .profile-room-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .profile-room-meta { font-size: 12px; color: var(--text-secondary); }
    .profile-empty { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 14px;
      padding: 8px 16px;
      text-decoration: none;
      margin-bottom: 24px;
      transition: all .2s;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .not-found {
      text-align: center;
      padding: 80px 20px;
    }
    .not-found-icon { font-size: 64px; margin-bottom: 20px; }
    .not-found-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
    .not-found-sub { font-size: 15px; color: var(--text-secondary); }
    .loading-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 15px; }
    @media (max-width: 600px) {
      .profile-card { flex-direction: column; align-items: center; text-align: center; }
      .profile-name-row { justify-content: center; }
      .profile-status { justify-content: center; }
    }
  </style>
</head>
<body class="dark-mode">
<script src="shared.js"></script>

<div class="profile-wrap">
  <a href="/index.html" class="back-btn">← العودة للدردشة</a>

  <div id="profile-content">
    <div class="loading-state">⏳ جاري التحميل...</div>
  </div>
</div>

<script>
(async function() {
  // Extract username from URL: /user/:username
  const parts = location.pathname.split('/');
  const username = decodeURIComponent(parts[parts.length - 1] || parts[parts.length - 2] || '');

  if (!username) {
    document.getElementById('profile-content').innerHTML = `
      <div class="not-found">
        <div class="not-found-icon">🔍</div>
        <div class="not-found-title">لم يتم تحديد مستخدم</div>
        <div class="not-found-sub">رابط الصفحة غير صحيح</div>
      </div>`;
    return;
  }

  document.title = `${username} — وَصْل`;

  try {
    const res  = await fetch(`/api/profile/${encodeURIComponent(username)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    renderProfile(data);
  } catch {
    document.getElementById('profile-content').innerHTML = `
      <div class="not-found">
        <div class="not-found-icon">👻</div>
        <div class="not-found-title">المستخدم غير موجود</div>
        <div class="not-found-sub">لا يوجد حساب بهذا الاسم في وَصْل</div>
      </div>`;
  }

  function renderProfile(data) {
    const joinDate = data.joinedAt ? new Date(data.joinedAt).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : 'غير محدد';

    const avatarHtml = data.avatar
      ? `<img src="${escHtml(data.avatar)}" alt="${escHtml(data.username)}" />`
      : data.username.charAt(0).toUpperCase();

    const verifiedHtml = data.verified
      ? `<span class="profile-verified-badge">موثق</span>`
      : '';

    const onlineHtml = data.isOnline
      ? `<div class="profile-online-dot"></div><span>متصل الآن</span>`
      : `<div class="profile-offline-dot"></div><span>غير متصل</span>`;

    const roomsHtml = data.rooms && data.rooms.length
      ? data.rooms.map(r => `
          <a class="profile-room-card" href="/index.html">
            <span style="font-size:20px">${r.persistent ? '📌' : '💬'}</span>
            <div>
              <div class="profile-room-name">${escHtml(r.name)}</div>
              <div class="profile-room-meta">${r.userCount} متصل</div>
            </div>
          </a>`).join('')
      : `<div class="profile-empty">لم ينضم إلى أي غرفة بعد</div>`;

    document.getElementById('profile-content').innerHTML = `
      <div class="profile-card">
        <div class="profile-avatar">${avatarHtml}</div>
        <div class="profile-info">
          <div class="profile-name-row">
            <span class="profile-username">${escHtml(data.username)}</span>
            ${verifiedHtml}
          </div>
          <div class="profile-status">${onlineHtml}</div>
          <div class="profile-join-date">📅 انضم في ${joinDate}</div>
        </div>
      </div>

      <div class="profile-section-title">🏠 الغرف المنضم إليها</div>
      <div class="profile-rooms-grid">${roomsHtml}</div>
    `;
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
